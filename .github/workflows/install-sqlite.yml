name: Install (sqlite)

# PR-H1: Verifies an sqlite-only install records the expected
# state["runtime"] snapshot in .phalanx/installed.json.
#
# Asserts:
#   * services.postgres.enabled == false
#   * memory.backend == "sqlite"
#   * activity.backend == "sqlite"
#
# Per-platform: each install type gets its own job so the harness exercises
# exactly one backend wiring at a time. PR-H2 will mirror this for postgres.

on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      phalanx_ref:
        description: 'phalanx core ref (branch, tag, or SHA)'
        required: false
        default: 'main'
  pull_request:
    paths:
      - '.github/workflows/install-sqlite.yml'
      - 'tests/test_install_sqlite.py'

jobs:
  install-sqlite:
    name: install-sqlite (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [claude, copilot, codex]
    steps:
      - name: Checkout phalanx core
        uses: actions/checkout@v4
        with:
          repository: td-project-ai/phalanx
          ref: ${{ inputs.phalanx_ref || 'main' }}
          path: phalanx
          fetch-depth: 1
          token: ${{ secrets.PHALANX_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Stage external bundle source
        run: |
          cp -r phalanx/tests/fixtures/synth_bundle_src external-bundles
          ls -la external-bundles

      - name: Install (sqlite-only)
        run: |
          mkdir -p target
          python phalanx/core/tools/platform/phalanx_install.py \
            --platform ${{ matrix.platform }} \
            --bundles synth-cloud \
            --bundle-source "$GITHUB_WORKSPACE/external-bundles" \
            --target "$GITHUB_WORKSPACE/target" \
            --skip-healthcheck

      - name: Write sqlite-only runtime config
        # The runtime snapshot reads <target>/.phalanx/config.yaml.
        # We drive an sqlite-only configuration: no services.postgres block,
        # memory + activity both wired to sqlite.
        run: |
          mkdir -p target/.phalanx
          cat > target/.phalanx/config.yaml <<'EOF'
          memory:
            backend: sqlite
          activity:
            backend: sqlite
          EOF
          cat target/.phalanx/config.yaml

      - name: Record runtime snapshot
        run: |
          python phalanx/core/tools/platform/bootstrap_state.py \
            --root "$GITHUB_WORKSPACE/target" \
            --record-runtime --json

      - name: Assert installed.json runtime block
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          state_path = Path("target/.phalanx/installed.json")
          if not state_path.is_file():
              print(f"::error::missing {state_path}")
              sys.exit(1)

          state = json.loads(state_path.read_text())
          runtime = state.get("runtime")
          if not isinstance(runtime, dict):
              print("::error::state['runtime'] missing or not a dict")
              print(json.dumps(state, indent=2))
              sys.exit(1)

          print("--- runtime block ---")
          print(json.dumps(runtime, indent=2))

          failures = []

          pg = runtime.get("services", {}).get("postgres", {})
          if pg.get("enabled") is not False:
              failures.append(f"services.postgres.enabled != False (got {pg!r})")

          mem = runtime.get("memory", {})
          if mem.get("backend") != "sqlite":
              failures.append(f"memory.backend != 'sqlite' (got {mem!r})")

          act = runtime.get("activity", {})
          if act.get("backend") != "sqlite":
              failures.append(f"activity.backend != 'sqlite' (got {act!r})")

          if failures:
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)

          print("OK: runtime snapshot is sqlite-only with postgres disabled")
          PY

      - name: Report on failure
        if: failure()
        run: |
          echo "::error::sqlite install runtime assertion failed for platform=${{ matrix.platform }}"
          echo "--- installed.json (if present) ---"
          cat target/.phalanx/installed.json 2>/dev/null || echo "(missing)"
